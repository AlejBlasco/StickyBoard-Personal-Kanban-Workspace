name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"

jobs:
  backend:
    name: Backend (build, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test (unit + integration)
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, real API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - name: Install Chromium system dependencies (browser cache hit)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Playwright starts the API (temporary SQLite) and Vite by itself
      - run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  docker:
    name: Docker (build, smoke test, hardening checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke test through Nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>StickyBoard</title>"
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q healthy
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy"

      - name: Create a task and check persistence across recreation
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" -d '{"title":"ci-persist"}' http://127.0.0.1:8080/api/v1/tasks > /dev/null
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/api/v1/tasks | grep -q ci-persist

      - name: Hardening checks
        run: |
          # API must not publish any port; web must be bound to loopback only
          test "$(docker inspect "$(docker compose ps -q api)" --format '{{json .HostConfig.PortBindings}}')" = "{}"
          docker inspect "$(docker compose ps -q web)" --format '{{json .HostConfig.PortBindings}}' | grep -q '"HostIp":"127.0.0.1"'
          # Unknown Host header is dropped, unlisted Origin is rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8080/ || true)" = "000"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{"title":"x"}' http://127.0.0.1:8080/api/v1/tasks)" = "403"
          # Non-root containers
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Scan images (HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stickyboard-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image (HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stickyboard-web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: NuGet vulnerabilities (direct and transitive)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          ! grep -q "has the following vulnerable packages" audit.txt
